<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewTratamientosTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewTratamientosLabel_traNumero}"/>
                    <h:outputText value="#{tratamientosController.selected.traNumero}" title="#{bundle.ViewTratamientosTitle_traNumero}"/>
                    <h:outputText value="#{bundle.ViewTratamientosLabel_traFechaAsignado}"/>
                    <h:outputText value="#{tratamientosController.selected.traFechaAsignado}" title="#{bundle.ViewTratamientosTitle_traFechaAsignado}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewTratamientosLabel_traDescripcion}"/>
                    <h:outputText value="#{tratamientosController.selected.traDescripcion}" title="#{bundle.ViewTratamientosTitle_traDescripcion}"/>
                    <h:outputText value="#{bundle.ViewTratamientosLabel_traFechaInicio}"/>
                    <h:outputText value="#{tratamientosController.selected.traFechaInicio}" title="#{bundle.ViewTratamientosTitle_traFechaInicio}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewTratamientosLabel_traFechaFin}"/>
                    <h:outputText value="#{tratamientosController.selected.traFechaFin}" title="#{bundle.ViewTratamientosTitle_traFechaFin}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewTratamientosLabel_traObservaciones}"/>
                    <h:outputText value="#{tratamientosController.selected.traObservaciones}" title="#{bundle.ViewTratamientosTitle_traObservaciones}"/>
                    <h:outputText value="#{bundle.ViewTratamientosLabel_traPaciente}"/>
                    <h:outputText value="#{tratamientosController.selected.traPaciente}" title="#{bundle.ViewTratamientosTitle_traPaciente}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{tratamientosController.destroyAndView}" value="#{bundle.ViewTratamientosDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewTratamientosEditLink}"/>
                <br />
                <h:commandLink action="#{tratamientosController.prepareCreate}" value="#{bundle.ViewTratamientosCreateLink}" />
                <br />
                <h:commandLink action="#{tratamientosController.prepareList}" value="#{bundle.ViewTratamientosShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewTratamientosIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
