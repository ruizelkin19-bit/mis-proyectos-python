<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateConsultoriosTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateConsultoriosLabel_conNumero}" for="conNumero" />
                    <h:inputText id="conNumero" value="#{consultoriosController.selected.conNumero}" title="#{bundle.CreateConsultoriosTitle_conNumero}" required="true" requiredMessage="#{bundle.CreateConsultoriosRequiredMessage_conNumero}"/>
                    <h:outputLabel value="#{bundle.CreateConsultoriosLabel_conNombre}" for="conNombre" />
                    <h:inputText id="conNombre" value="#{consultoriosController.selected.conNombre}" title="#{bundle.CreateConsultoriosTitle_conNombre}" required="true" requiredMessage="#{bundle.CreateConsultoriosRequiredMessage_conNombre}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{consultoriosController.create}" value="#{bundle.CreateConsultoriosSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{consultoriosController.prepareList}" value="#{bundle.CreateConsultoriosShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateConsultoriosIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
